<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#003366">
  <link rel="manifest" href="manifest.json">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.googleapis.com; media-src *; img-src 'self' data: content: https://*.googleusercontent.com https://*.google.com https://*.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://accounts.google.com https://apis.google.com https://www.gstatic.com https://*.google.com; connect-src 'self' https://*.googleapis.com https://accounts.google.com https://*.google.com https://*.gstatic.com;">
  <title>Rondas ARC Simón Bolívar</title>
  <!-- Dependencies handled via npm/vite -->
  <!-- Mock process for browser environment to prevent blank screen -->
  <script>
    window.process = { env: { API_KEY: "" } };
  </script>
  <!-- Google APIs will be injected dynamically via driveService.ts -->
</head>

<body class="bg-slate-50 text-slate-900 overflow-x-hidden">
  <div id="root"></div>
  <script type="module" src="index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' }).then(reg => {
          console.log('SW registrado correctamente');
        }).catch(err => {
          console.log('Error registro SW', err);
        });
      });
    }
  </script>
</body>

</html>
